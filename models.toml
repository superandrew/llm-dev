# Model registry. Every runtime parameter lives here, nothing is hardcoded in the CLI.
[defaults]
host = "127.0.0.1"

[models.qwen-coder-next]
backend = "ollama"          # ollama | llama | mlx
model = "qwen3-coder-next"  # ollama tag, GGUF path (llama) or MLX path/repo (mlx)
ctx = 65536
port = 11434
notes = "Same model through Ollama; the working model is qwen-coder-next-mlx."

[models.qwen-coder-next-mlx]
backend = "mlx"
model = "~/models/mlx/Qwen3-Coder-Next-4bit"
ctx = 65536
port = 8081
args = ["--max-tokens", "8192"]

[models.qwen38-mlx]
backend = "mlx"
model = "~/models/mlx/Qwen3.8-27B-MLX-4bit"
ctx = 65536
port = 8082
source = "lmstudio-community/Qwen3.8-27B-MLX-4bit"
args = ["--max-tokens", "8192", "--chat-template-args", '{"enable_thinking":false}']

[models.qwen-coder-next-mlx6]
backend = "mlx"
model = "~/models/mlx/Qwen3-Coder-Next-MLX-6bit"
ctx = 65536
port = 8083
source = "lmstudio-community/Qwen3-Coder-Next-MLX-6bit"
args = ["--max-tokens", "8192"]

# Standard Q4_K_M GGUF (Ollama renames tensors, so its blob does not load): one setting changes per entry.
[models.qwen-coder-next-gguf]
backend = "llama"
model = "~/models/gguf/Qwen3-Coder-Next-Q4_K_M.gguf"
source = "lmstudio-community/Qwen3-Coder-Next-GGUF"
ctx = 65536
port = 8084
args = ["-ngl", "99", "-np", "1"]

[models.qwen-coder-next-gguf-spec]
backend = "llama"
model = "~/models/gguf/Qwen3-Coder-Next-Q4_K_M.gguf"
source = "lmstudio-community/Qwen3-Coder-Next-GGUF"
ctx = 65536
port = 8085
args = ["-ngl", "99", "-np", "1", "--spec-type", "ngram-mod"]

[models.qwen-coder-next-gguf-batch]
backend = "llama"
model = "~/models/gguf/Qwen3-Coder-Next-Q4_K_M.gguf"
source = "lmstudio-community/Qwen3-Coder-Next-GGUF"
ctx = 65536
port = 8086
args = ["-ngl", "99", "-np", "1", "-b", "4096", "-ub", "2048"]

[models.gpt-oss-120b-mlx]
backend = "mlx"
model = "~/models/mlx/gpt-oss-120b-MXFP4-Q8"
ctx = 65536
port = 8087
source = "mlx-community/gpt-oss-120b-MXFP4-Q8"
args = ["--max-tokens", "8192"]

[models.qwen36-mlx6]
backend = "mlx"
model = "~/models/mlx/Qwen3.6-35B-A3B-6bit"
ctx = 65536
port = 8088
source = "mlx-community/Qwen3.6-35B-A3B-6bit"
args = ["--max-tokens", "8192"]

[models.nanbeige43-gguf]
backend = "llama"
model = "~/models/gguf/Nanbeige_Nanbeige4.3-33B-Q4_K_M.gguf"
ctx = 65536
port = 8089
source = "bartowski/Nanbeige_Nanbeige4.3-33B-GGUF"
args = ["-ngl", "99", "-np", "1"]

[models.qwen36-mlx6-nothink]
backend = "mlx"
model = "~/models/mlx/Qwen3.6-35B-A3B-6bit"
ctx = 65536
port = 8090
source = "mlx-community/Qwen3.6-35B-A3B-6bit"
args = ["--max-tokens", "8192", "--chat-template-args", "{\"enable_thinking\":false}"]

[models.gpt-oss-120b-gguf]
backend = "llama"
model = "~/models/gguf/gpt-oss-120b-MXFP4.gguf"
ctx = 65536
port = 8091
source = "ggml-org/gpt-oss-120b-GGUF"
args = ["-ngl", "99", "-np", "1"]
